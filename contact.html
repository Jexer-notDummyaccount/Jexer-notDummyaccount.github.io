  <style>
    /* --------------------- Contact Page CSS --------------------- */
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding-top: 70px; /* Adjust for navbar */
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    }

    header {
      width: 100%;
      text-align: center;
      padding: 30px;
      font-size: 2rem;
      font-weight: bold;
      background: linear-gradient(90deg, #00d4ff, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glow 3s infinite alternate;
    }

    @keyframes glow {
      0% { text-shadow: 0 0 10px #00d4ff, 0 0 20px #7c3aed; }
      100% { text-shadow: 0 0 20px #7c3aed, 0 0 30px #00d4ff; }
    }

    .contact-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      max-width: 900px;
      margin: 40px 20px;
    }

    .contact-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 30px 25px;
      width: 280px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      cursor: pointer;
      animation: float 3s ease-in-out infinite;
    }

    .contact-card:hover {
      transform: scale(1.08);
      box-shadow: 0 12px 35px rgba(0, 255, 255, 0.6);
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    .contact-icon {
      font-size: 50px;
      margin-bottom: 15px;
      color: #00d4ff;
      transition: transform 0.3s ease, color 0.3s ease;
    }

    .contact-card:hover .contact-icon {
      transform: scale(1.2) rotate(10deg);
      color: #7c3aed;
    }

    h2 {
      margin: 10px 0;
      font-size: 1.5rem;
      color: #00d4ff;
    }

    p, a {
      font-size: 1rem;
      color: #f1f1f1;
      text-decoration: none;
      word-wrap: break-word;
    }

    a:hover {
      color: #7c3aed;
      text-shadow: 0 0 5px #00d4ff, 0 0 10px #7c3aed;
    }

    footer {
      margin-top: auto;
      padding: 15px;
      font-size: 0.85rem;
      color: #ccc;
      text-align: center;
      text-shadow: 0 0 5px black;
    }

    @media (max-width: 650px) {
      .contact-card { width: 90%; }
    }
  </style>

  <!-- Link Font Awesome for icons -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>

    <div class="contact-card">
      <i class="fas fa-envelope contact-icon"></i>
      <h2>Email</h2>
      <p><a href="mailto:waaldomeng69@gmail.com">waaldomeng69@gmail.com</a></p>
    </div>

    <!-- Facebook -->
    <div class="contact-card">

      <h2>Facebook</h2>
      <p><a href="https://www.facebook.com/Wally.Domeng" target="_blank">Wally Domeng</a></p>

    </div>
